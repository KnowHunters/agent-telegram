services:
  telegram-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: knowhunters/agent-telegram-gateway:local
    container_name: agent-telegram-gateway
    restart: unless-stopped
    env_file:
      - .env.gateway
    environment:
      AGENT_TELEGRAM_SESSION_PROVIDER: file
      AGENT_TELEGRAM_PROFILE: ${AGENT_TELEGRAM_PROFILE:-default}
    ports:
      - 127.0.0.1:${GATEWAY_HOST_PORT:-18080}:8080
    volumes:
      - telegram-gateway-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  telegram-gateway-data:
    external: true
